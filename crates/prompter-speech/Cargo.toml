[package]
name = "prompter-speech"
description = "Audio capture, streaming speech engine and transcript bus for PolarityPrompt. Depends only on prompter-core types."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
prompter-core = { workspace = true }
serde = { workspace = true }
cpal = "0.18"
rtrb = "0.4"
vosk = "0.3"
sha2 = "0.10"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dev-dependencies]
serde_json = { workspace = true }
