# Builds the installers on GitHub's own macOS and Windows machines.
# Runs when a version tag is pushed (v0.1.0, v0.2.0, …) or when started by hand
# from the Actions tab. On a tag it also creates a GitHub Release with the files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            bundles: dmg
            artifact: target/release/bundle/dmg/*.dmg
          - name: Windows (64-bit)
            os: windows-latest
            bundles: nsis
            artifact: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Fetch speech models and libvosk
        shell: bash
        run: bash scripts/fetch-models.sh

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the app bundle
        shell: bash
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}

      - name: Keep the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolarityPrompt-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
