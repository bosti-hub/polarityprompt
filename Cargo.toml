[workspace]
resolver = "2"
members = [
    "crates/prompter-core",
    "crates/prompter-speech",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["F. Bos - OnPolarity.com"]
publish = false

[workspace.dependencies]
prompter-core = { path = "crates/prompter-core" }
prompter-speech = { path = "crates/prompter-speech" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
